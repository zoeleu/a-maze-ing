[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator (42 A-Maze-ing project)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{ name = "Zoe T. Leullier" }, { name = "Flora P. C. Carvalho" }]
dependencies = ["typing_extensions>=4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]

[tool.mypy]
python_version = "3.10"
exclude = [
    '^\.venv[^/]*/',  # .venv, .venv-pypy3...: one per Python
    '^\.claude/',
    '^build/',
    '^dist/',
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
# -n auto: one worker per CPU core (pytest-xdist); pass -n 0 to run serially
addopts = ["-ra", "--import-mode=importlib", "-n", "auto"]
strict = true
markers = [
    "ui: drives the Textual interface through a headless pilot",
]
